<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alexa Winters — Digital Business Card</title>
<meta name="description" content="Kartu nama digital interaktif — semua tautan dan profil dalam satu kartu premium.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="noise-overlay" aria-hidden="true"></div>

  <main class="page" id="page">

    <header class="page__header" id="pageHeader">
      <div class="brand" id="brandLogo">
        <span class="brand__mark">◆</span>
        <span class="brand__name">Digital Card</span>
      </div>
      <a class="edit-link" href="admin.html">Edit Profile</a>
    </header>

    <section class="hero-section" id="heroSection">
      <!-- hero card injected by app.js -->
    </section>

    <section class="links-section" aria-label="Links">
      <div class="section-heading">
        <span class="section-heading__eyebrow">Connect</span>
        <h2 class="section-heading__title">Find me everywhere</h2>
      </div>
      <div class="link-grid" id="linkGrid" data-tilt-root>
        <!-- link cards injected by app.js -->
      </div>
    </section>

    <footer class="page__footer">
      <p>Crafted as a living business card · <span id="footerYear"></span></p>
    </footer>
  </main>

  <!-- Share Modal -->
  <div class="modal" id="shareModal">
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__panel">
      <div class="modal__head">
        <h3>Share this card</h3>
        <button class="icon-btn" data-close-modal aria-label="Close">✕</button>
      </div>

      <div class="modal__qr" id="qrCanvas"></div>

      <div class="modal__url">
        <span id="shareUrlText"></span>
      </div>

      <div class="modal__actions">
        <button class="btn btn--primary" id="copyLinkBtn">Copy Link</button>
        <button class="btn btn--ghost" id="downloadQrBtn">Download QR</button>
      </div>

      <div class="modal__row">
        <button class="chip-btn" id="waShareBtn">WhatsApp</button>
        <button class="chip-btn" id="tgShareBtn">Telegram</button>
        <button class="chip-btn" id="nativeShareBtn">More…</button>
      </div>
    </div>
  </div>

  <!-- Vendor -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <!-- App -->
  <script src="js/storage.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/animation.js"></script>
  <script src="js/share.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
